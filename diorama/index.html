<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storm Diorama</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0dd; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud {
        position: absolute; left: 12px; top: 10px;
        font: 12px/1.5 system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.55); border-radius: 6px;
        padding: 6px 10px; pointer-events: none; white-space: pre;
      }
      #bar {
        position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px;
        font: 13px system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.6); border-radius: 8px;
        padding: 8px 14px; backdrop-filter: blur(4px);
        user-select: none;
      }
      #bar button {
        font: 15px system-ui, sans-serif; width: 34px; height: 26px;
        border: none; border-radius: 5px; background: rgba(43, 58, 61, 0.12);
        color: #2b3a3d; cursor: pointer;
      }
      #bar button:hover { background: rgba(43, 58, 61, 0.22); }
      #bar select {
        font: 12px system-ui, sans-serif; color: #2b3a3d;
        border: none; border-radius: 5px; background: rgba(43, 58, 61, 0.12);
        padding: 4px 6px; cursor: pointer;
      }
      #scrub { width: min(46vw, 520px); accent-color: #46707c; }
      #clock { min-width: 11em; text-align: left; font-variant-numeric: tabular-nums; }
      #err {
        position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
        font: 14px system-ui, sans-serif; color: #7a2f2f; max-width: 46em;
        background: rgba(255, 255, 255, 0.9); border-radius: 8px; padding: 14px 18px;
        display: none; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="bar" style="display: none">
      <button id="play" title="play/pause (space)">▶</button>
      <select id="speed" title="playback speed (storm time vs wall time)">
        <option value="15">15×</option>
        <option value="30">30×</option>
        <option value="60" selected>60×</option>
        <option value="120">120×</option>
        <option value="300">300×</option>
      </select>
      <input id="scrub" type="range" min="0" max="3600" step="1" value="0" />
      <span id="clock"></span>
    </div>
    <div id="err"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
