<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title identifies this server to tools/find-server.mjs (the
         launcher's reuse check) and to session capture/perf drivers. Renaming
         it without updating TITLE there silently returns the launcher to
         starting a new server per double-click. -->
    <title>Storm Diorama</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0dd; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud {
        position: absolute; left: 12px; top: 10px;
        font: 12px/1.5 system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.55); border-radius: 6px;
        padding: 6px 10px; pointer-events: none; white-space: pre;
      }
      #bar {
        position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px;
        font: 13px system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.6); border-radius: 8px;
        padding: 8px 14px; backdrop-filter: blur(4px);
        user-select: none;
      }
      #bar button {
        font: 15px system-ui, sans-serif; width: 34px; height: 26px;
        border: none; border-radius: 5px; background: rgba(43, 58, 61, 0.12);
        color: #2b3a3d; cursor: pointer;
      }
      #bar button:hover { background: rgba(43, 58, 61, 0.22); }
      #bar select {
        font: 12px system-ui, sans-serif; color: #2b3a3d;
        border: none; border-radius: 5px; background: rgba(43, 58, 61, 0.12);
        padding: 4px 6px; cursor: pointer;
      }
      #fpsWrap { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
      #bar input[type="number"] {
        font: 12px system-ui, sans-serif; color: #2b3a3d; width: 3.2em;
        border: none; border-radius: 5px; background: rgba(43, 58, 61, 0.12);
        padding: 4px 4px 4px 6px;
      }
      #scrub { width: min(40vw, 460px); accent-color: #46707c; }
      #clock { min-width: 18em; text-align: left; font-variant-numeric: tabular-nums; }
      #err {
        position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
        font: 14px system-ui, sans-serif; color: #7a2f2f; max-width: 46em;
        background: rgba(255, 255, 255, 0.9); border-radius: 8px; padding: 14px 18px;
        display: none; white-space: pre-wrap;
      }
      /* right-side column: the data-layer panel (T8) stacked above the legend.
         A flex column so the legend sits directly under the panel and a hidden
         legend (display:none) leaves no gap. */
      #rightcol {
        position: absolute; right: 12px; top: 10px;
        display: flex; flex-direction: column; align-items: stretch;
        gap: 8px; width: 190px;
      }
      /* data-layer panel (T8): the teaching-grade selector — radio rows with
         per-layer units + a DIAGNOSTIC badge, replacing keystroke-only control. */
      #layers {
        font: 12px system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.6); border-radius: 6px;
        padding: 7px 10px; backdrop-filter: blur(4px);
      }
      #layersTitle { font-weight: 600; margin-bottom: 5px; }
      #layers label {
        display: flex; align-items: baseline; gap: 6px;
        padding: 2px 0; cursor: pointer;
      }
      #layers label input { margin: 0; accent-color: #46707c; cursor: pointer; }
      #layers .lname { flex: 1; }
      #layers .ldiag {
        font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
        color: #8a5a12; background: rgba(212, 148, 30, 0.18);
        border-radius: 3px; padding: 1px 4px; align-self: center;
      }
      /* cross-section legend (slice 5a) — DOM, so it stays undistorted under ?sx */
      #xlegend {
        font: 12px system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.6); border-radius: 6px;
        padding: 7px 10px; pointer-events: none; display: none;
        backdrop-filter: blur(4px);
      }
      #xlTitle { font-weight: 600; margin-bottom: 5px; }
      #xlBar {
        height: 12px; border-radius: 3px; border: 1px solid rgba(43, 58, 61, 0.25);
      }
      #xlScale {
        display: flex; justify-content: space-between;
        font-variant-numeric: tabular-nums; margin-top: 2px;
      }
      #xlAxis { margin-top: 5px; color: #46707c; }
      /* scale bar (slice 5c) — DOM, so it stays undistorted and crisp. Anchored
         bottom-left (the cartographic convention) rather than under the HUD:
         the HUD's line count changes with the active layer, so a fixed `top`
         here would collide with it the moment a banner appears. */
      #scalebar {
        position: absolute; left: 12px; bottom: 12px;
        font: 12px/1.4 system-ui, sans-serif; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.55); border-radius: 6px;
        padding: 6px 10px; pointer-events: none;
      }
      /* the rule itself: a spanning line with end ticks, width set from JS */
      /* border-box so the OUTER width (tick edge to tick edge) is exactly the
         width JS sets — under content-box the two 1px end ticks are added on
         top of it, which overstates the bar by ~1.3 px (0.7 % at 150 px). */
      #sbRule {
        height: 6px; border: 1px solid #2b3a3d; border-top: none;
        box-sizing: border-box; min-width: 8px;
      }
      #sbLabel { font-variant-numeric: tabular-nums; margin-top: 2px; }
      #sbNote { color: #46707c; }
      /* ?stats perf readout (fps + per-pass GPU ms) — top centre, between the
         HUD and the layer panel (bottom-right collided with the control bar);
         hidden unless ?stats. */
      #stats {
        position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
        max-width: 44vw; white-space: normal; text-align: center;
        font: 11px/1.4 ui-monospace, monospace; color: #2b3a3d;
        background: rgba(255, 255, 255, 0.55); border-radius: 6px;
        padding: 5px 8px; pointer-events: none; display: none;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="bar" style="display: none">
      <span id="scenarioLbl" style="display: none">Storm</span>
      <select
        id="scenario"
        title="which storm package to play — a coarser export streams faster, the full-detail one is sharper (reloads on change)"
        style="display: none"
      ></select>
      <button id="play" title="play/pause (space)">▶</button>
      <select id="speed" title="playback speed (storm time vs wall time)">
        <option value="15">15×</option>
        <option value="30">30×</option>
        <option value="60" selected>60×</option>
        <option value="120">120×</option>
        <option value="300">300×</option>
      </select>
      <label id="fpsWrap" title="frame-rate cap — limits rendered fps to save GPU/power (max 240)">
        <input id="fps" type="number" min="15" max="240" step="5" value="60" />fps
      </label>
      <input id="scrub" type="range" min="0" max="3600" step="1" value="0" />
      <span id="clock"></span>
    </div>
    <div id="scalebar">
      <div id="sbRule"></div>
      <div id="sbLabel"></div>
      <div id="sbNote">across the storm, at centre depth</div>
    </div>
    <div id="err"></div>
    <div id="stats"></div>
    <div id="rightcol">
      <div id="layers" style="display: none">
        <div id="layersTitle">Data layer</div>
        <!-- radio rows injected by main.ts (the w row is feature-detected) -->
      </div>
      <div id="xlegend">
        <div id="xlTitle">total hydrometeors</div>
        <div id="xlBar"></div>
        <div id="xlScale"><span id="xlMin">0</span><span id="xlMax">10 g/kg</span></div>
        <div id="xlAxis"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
